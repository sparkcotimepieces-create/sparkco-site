<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark & Co. Timepieces</title>
  <style>
    body{background:#000;color:#fff;font-family:Arial;padding:40px}
    input,textarea,select{display:block;width:100%;margin:10px 0;padding:12px;background:#111;color:#fff;border:1px solid #333;border-radius:6px}
    button{padding:14px;background:#d4af37;border:none;color:#000;font-weight:bold;border-radius:6px;cursor:pointer}
  </style>
</head>
<body>

<h1>Spark & Co. Timepieces</h1>
<p>Sell your watch with confidence. We respond within 10–15 minutes.</p>

<form action="https://formspree.io/f/your_form_id" method="POST">

<input type="text" name="full_name" placeholder="Full Name" required>
<input type="email" name="email" placeholder="Email" required>
<input type="text" name="phone" placeholder="Phone">
<input type="text" name="brand_model" placeholder="Brand / Model">
<input type="text" name="reference_number" placeholder="Reference Number">

<select name="condition">
<option>Condition</option>
<option>Excellent</option>
<option>Very Good</option>
<option>Good</option>
<option>Fair</option>
</select>

<textarea name="details" placeholder="Tell us about your watch"></textarea>

<button type="submit">Get My Private Offer</button>

</form>

</body>
</html>
