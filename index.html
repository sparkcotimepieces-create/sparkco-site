<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark & Co. Timepieces</title>

<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial;}
.wrap{max-width:1200px;margin:auto;padding:40px;}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;}
h1{font-size:60px;font-family:Georgia;}
p{color:#ccc;font-size:20px;}
.box{background:#111;border-radius:20px;padding:20px;}
.hero-images{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.hero-main{grid-column:span 2;height:400px;background:#000;border-radius:20px;display:flex;align-items:center;justify-content:center;}
.hero-main img{
width:100%;
height:100%;
object-fit:contain;
background:#000;
padding:10px;
}
.hero-small{height:200px;border-radius:20px;overflow:hidden;}
.hero-small img{
width:100%;
height:100%;
object-fit:cover;
}
</style>
</head>

<body>
<div class="wrap">
<div class="hero">

<div>
<h1>Sell Your Luxury Watch</h1>
<p>Premium experience for Rolex, AP, and Hublot owners.</p>
</div>

<div class="box">
<div class="hero-images">

<div class="hero-main">
<img src="rolex.jpg">
</div>

<div class="hero-small">
<img src="hublot.jpg">
</div>

<div class="hero-small">
<img src="ap.jpg">
</div>

</div>
</div>

</div>
</div>
</body>
</html>
