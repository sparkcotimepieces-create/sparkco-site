<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Watches | Spark &amp; Co. Timepieces</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:linear-gradient(180deg,#060606 0%,#040404 100%);
      color:#f5f0e6;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:24px;
    }
    .card{
      max-width:760px;
      width:100%;
      border-radius:30px;
      padding:40px;
      background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.06);
      box-shadow:0 30px 80px rgba(0,0,0,.55);
    }
    .eyebrow{
      color:#f1d98d;
      text-transform:uppercase;
      letter-spacing:.22em;
      font-size:13px;
      font-weight:700;
      margin-bottom:18px;
    }
    h1{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      font-size:clamp(40px,6vw,72px);
      line-height:.96;
      letter-spacing:-.03em;
    }
    p{
      margin:18px 0 0;
      color:#cfc1a8;
      font-size:20px;
      line-height:1.8;
    }
    a{
      display:inline-flex;
      margin-top:28px;
      min-height:54px;
      padding:0 24px;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      border:1px solid rgba(217,178,76,.22);
      color:#f1d98d;
      text-decoration:none;
      font-weight:700;
      background:rgba(255,255,255,.02);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Available Watches</div>
    <h1>Inventory coming soon</h1>
    <p>
      This page is ready for your live inventory. As you add available watches, they can be displayed here with the same luxury presentation.
    </p>
    <a href="index.html">Back to Home</a>
  </div>
</body>
</html>
